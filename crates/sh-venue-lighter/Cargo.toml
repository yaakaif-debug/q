[package]
name = "sh-venue-lighter"
description = "Lighter public market-data adapter (M0: no signer, read-only WebSocket)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sh-core.workspace = true
sh-venue-api.workspace = true
sh-md.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
tracing.workspace = true
metrics.workspace = true
libloading.workspace = true
secrecy.workspace = true
reqwest.workspace = true
chrono.workspace = true
thiserror.workspace = true

# unsafe разрешён только в изолированном модуле FFI к подписанту (`signer`);
# остальные модули объявляют `#![forbid(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
