# cargo-deny: лицензии и уязвимости зависимостей.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Исключения с обоснованием (пересматривать при каждом обновлении alloy):
# - RUSTSEC-2026-0387: crypto-bigint 0.5 (через k256 0.13 в alloy-signer-local). Подпись
#   выполняется локально на сервере; удалённого измерения времени отдельных операций
#   подписи нет. Обновление требует k256 0.14 в alloy — ждём релиз.
# - RUSTSEC-2024-0436: paste не поддерживается; это proc-macro времени компиляции
#   (alloy-primitives), в исполняемом коде его нет.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via alloy k256; local signing only, no remote timing oracle; upgrade blocked on alloy" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time proc-macro used by alloy-primitives" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# собственные крейты не публикуются
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# внутренние path-зависимости без версии — не «wildcard» для крейтов, которые не публикуются
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
